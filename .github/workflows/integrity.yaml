name: 'integrity'

on:
  pull_request:
    paths: ['**', '!**.md']

jobs:
  files:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 0
      - name: 'Check for CRLF line endings'
        uses: 'gi-org-pl/check-crlf-action@464995c09f1659cd4b0f7e2bf7234994f0fd705e' # v1.0.2
      - name: 'Check for file permission changes'
        uses: 'gi-org-pl/check-file-permissions-action@1cec1b07fa817da3da98bd2da20992365d6b4da6' # v1.0.0
      - name: 'Check app version is unique'
        uses: 'gi-org-pl/check-version-action@c884d1e92d3eef7b26d6277d49f18d0803009d73' # v1.0.0
        with:
          version: "$(jq -r '.version' package.json)"
  code:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - name: 'Set up Node'
        uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1' # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - name: 'Install dependencies'
        run: 'npm ci'
      - name: 'Check code with linter and formatter'
        run: 'npm run lint:ci'
      - name: 'Run type check'
        run: 'npm run typecheck'
      - name: 'Run unit tests'
        run: 'npm test'
  executable:
    runs-on: 'windows-2025'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - name: 'Set up Node'
        uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1' # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - name: 'Set up Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # v2.2.0
        with:
          bun-version: 'latest'
      - name: 'Install dependencies'
        run: 'npm ci'
      - name: 'Compile the Windows executable'
        run: 'npm run build:exe'
      - name: 'Smoke test the executable'
        shell: 'pwsh'
        run: './scripts/smoke-test.ps1'
      - name: 'Check the executable carries the icon and properties'
        shell: 'pwsh'
        run: './scripts/check-icon.ps1'
      - name: 'Check the dashboard renders from the executable'
        shell: 'pwsh'
        run: './scripts/check-frame.ps1'
      - name: 'Check the tray icon reaches the notification area'
        shell: 'pwsh'
        run: './scripts/check-tray.ps1'

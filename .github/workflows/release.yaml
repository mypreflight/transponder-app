name: 'release'

on:
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  tag:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Clone repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - name: 'Release and push git tag'
        run: "git tag $(jq -r '.version' package.json) && git push --tags"
      - name: 'Create a draft GitHub release'
        run: "gh release create $(jq -r '.version' package.json) --draft --generate-notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  executable:
    needs: tag
    runs-on: 'windows-2025'
    steps:
      - name: 'Clone repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - name: 'Set up Node'
        uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1' # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - name: 'Set up Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # v2.2.0
        with:
          bun-version: 'latest'
      - name: 'Install dependencies'
        run: 'npm ci'
      - name: 'Compile the Windows executable'
        run: 'npm run build:exe'
        env:
          ADSB_CLIENT_TOKEN: ${{ secrets.ADSB_CLIENT_TOKEN }}
      - name: 'Smoke test the executable'
        shell: 'pwsh'
        run: './scripts/smoke-test.ps1'
      - name: 'Check the executable carries the icon and properties'
        shell: 'pwsh'
        run: './scripts/check-icon.ps1'
      - name: 'Check the dashboard renders from the executable'
        shell: 'pwsh'
        run: './scripts/check-frame.ps1'
      - name: 'Check the tray icon reaches the notification area'
        shell: 'pwsh'
        run: './scripts/check-tray.ps1'
      - name: 'Attach the executable to the draft release'
        shell: 'bash'
        run: "gh release upload $(jq -r '.version' package.json) dist/mypreflight-transponder.exe"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Publish the release'
        shell: 'bash'
        run: "gh release edit $(jq -r '.version' package.json) --draft=false --latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

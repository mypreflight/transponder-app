name: 'test-build'

on:
  workflow_dispatch:
  push:
    branches: ['feature/gsx-integration']
    paths: ['src/**', 'bin/**', 'package.json', '.github/workflows/test-build.yaml']

jobs:
  executable:
    runs-on: 'windows-2025'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - name: 'Set up Node'
        uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1' # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - name: 'Set up Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # v2.2.0
        with:
          bun-version: 'latest'
      - name: 'Install dependencies'
        run: 'npm ci'
      - name: 'Compile the Windows executable'
        run: 'npm run build:exe'
        env:
          ADSB_CLIENT_TOKEN: ${{ secrets.ADSB_CLIENT_TOKEN }}
      - name: 'Smoke test the executable'
        shell: 'pwsh'
        run: './scripts/smoke-test.ps1'
      - name: 'Upload the executable as an artifact'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          name: "mypreflight-transponder-${{ github.sha }}"
          path: 'dist/mypreflight-transponder.exe'
          retention-days: 14
          if-no-files-found: 'error'
